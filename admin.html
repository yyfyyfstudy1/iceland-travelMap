<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>冰岛一日游 · 管理后台</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root{
    --bg:#e7edf0; --panel:#fff; --ink:#0e1620; --ink2:#48555f; --muted:#8593a0;
    --line:#dce4e9; --accent:#0e7c86; --accent-ink:#0b5f67; --chip:#eef3f5;
    --ok:#137a53; --warn:#a8600a; --danger:#b23b3b;
    --shadow:0 1px 2px rgba(12,26,36,.08),0 8px 30px rgba(12,26,36,.08);
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0b0f13; --panel:#12181d; --ink:#e9f1f4; --ink2:#a4b2bc; --muted:#6f7d88;
    --line:#212a31; --accent:#43c6d0; --accent-ink:#7fe0e7; --chip:#18212a;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 34px rgba(0,0,0,.45);}}
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  .tnum{font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer}
  input,select{font-family:inherit;font-size:14px}
  .hidden{display:none!important}

  /* login */
  .login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}
  .login .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
    padding:28px;width:100%;max-width:360px}
  .login h1{font-size:19px;margin:0 0 4px}
  .login p{color:var(--muted);font-size:13px;margin:0 0 20px}
  .field{display:block;margin-bottom:12px}
  .field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:5px}
  .field input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--ink)}
  .btn{border:0;border-radius:11px;padding:11px 16px;font-size:14px;font-weight:700;background:var(--accent);color:#fff}
  .btn:hover{filter:brightness(1.05)} .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:var(--chip);color:var(--ink)}
  .btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
  .btn.danger{background:var(--danger)}
  .msg{font-size:12.5px;margin-top:10px;min-height:16px}
  .msg.err{color:var(--danger)} .msg.ok{color:var(--ok)}

  /* app */
  .top{display:flex;align-items:center;gap:12px;padding:12px clamp(12px,3vw,22px);background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .top h1{font-size:16px;margin:0;font-weight:800}
  .top .who{font-size:12.5px;color:var(--muted);margin-left:auto}
  .wrap{max-width:1200px;margin:0 auto;padding:16px clamp(12px,3vw,22px)}
  .rates{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:16px}
  .rates .h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .rates .h b{font-size:14px} .rates .upd{font-size:11.5px;color:var(--muted)}
  .rates .grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .rate-pill{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px}
  .rate-pill b{color:var(--accent-ink)}
  .toolrow{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}

  .grid2{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}
  @media (max-width:820px){.grid2{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  .listwrap{padding:10px}
  .search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin-bottom:8px}
  .list{max-height:70vh;overflow:auto}
  .row{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;cursor:pointer}
  .row:hover{background:var(--chip)} .row.sel{background:var(--chip);box-shadow:inset 3px 0 0 var(--accent)}
  .row .dot{width:10px;height:10px;border-radius:50%;flex:none}
  .row .nm{flex:1;min-width:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .pr{font-size:12px;color:var(--muted);white-space:nowrap}
  .count{font-size:11.5px;color:var(--muted);padding:2px 6px 8px}

  .editor{padding:16px}
  .editor .empty{color:var(--muted);font-size:13.5px;text-align:center;padding:60px 0}
  .eh{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .eh .id{font-size:11px;color:var(--muted);font-family:ui-monospace,monospace}
  .fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media (max-width:560px){.fgrid{grid-template-columns:1fr}}
  .f{display:flex;flex-direction:column;gap:4px}
  .f.full{grid-column:1/-1}
  .f label{font-size:11px;color:var(--muted);font-weight:700}
  .f input,.f select{padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
  .aiimport{display:flex;gap:8px;margin-bottom:12px}
  .aiimport input{flex:1;min-width:0;padding:9px 11px;border:1px solid var(--accent);border-radius:10px;background:var(--bg);color:var(--ink);font-size:13px}
  .aiimport .btn{white-space:nowrap}
  /* batch compare console */
  .binput{flex:1;min-width:220px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
  .bsel{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
  .batchresult{margin-top:12px;display:flex;flex-direction:column;gap:6px}
  .bgrouphd{font-size:12px;font-weight:800;color:var(--muted);margin:8px 2px 2px;text-transform:uppercase;letter-spacing:.04em}
  .brow{display:grid;grid-template-columns:auto auto 1fr;gap:6px 10px;align-items:center;
    border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:8px 11px;background:var(--panel)}
  .brow.new{border-left-color:var(--ok)} .brow.changed{border-left-color:var(--warn)}
  .brow.same{border-left-color:var(--line);opacity:.72} .brow.error{border-left-color:var(--danger)}
  .brow input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
  .bstat{font-size:12px;font-weight:800;white-space:nowrap}
  .brow.new .bstat{color:var(--ok)} .brow.changed .bstat{color:var(--warn)}
  .brow.same .bstat{color:var(--muted)} .brow.error .bstat{color:var(--danger)}
  .bname{font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bmeta{grid-column:3;font-size:12px;color:var(--muted)}
  .bdiff{grid-column:1 / -1;font-size:12.5px;background:var(--chip);border-radius:8px;padding:6px 9px;line-height:1.7}
  .bdiff .fld{font-weight:700;color:var(--ink2)} .bdiff s{color:var(--danger);opacity:.8} .bdiff b{color:var(--ok)}
  .bdiff .sep{color:var(--muted);margin:0 8px}
  .burl{grid-column:1 / -1;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* source config editor */
  .srccfg{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
  .srccfg-hd{font-size:12px;color:var(--muted);margin-bottom:8px} .srccfg-hd code{background:var(--chip);padding:1px 5px;border-radius:5px}
  .srccfg-ta{width:100%;min-height:200px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
    border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink);resize:vertical}
  .srccfg-actions{display:flex;align-items:center;gap:10px;margin-top:8px}
  .srccfg-msg{font-size:12.5px;color:var(--muted)}
  /* progress modal */
  .modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
    background:rgba(8,14,18,.55);backdrop-filter:blur(3px);padding:20px}
  .modal-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
    width:100%;max-width:520px;padding:18px 20px}
  .modal-hd{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:15px;margin-bottom:12px}
  .modal-x{border:0;background:transparent;color:var(--muted);font-size:16px;line-height:1;padding:4px}
  .pstage{font-size:13.5px;color:var(--ink);margin-bottom:8px;font-weight:600}
  .pbar{height:10px;border-radius:999px;background:var(--chip);overflow:hidden}
  .pfill{height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .25s ease}
  .pcount{font-size:12.5px;color:var(--muted);margin:7px 0}
  .plog{max-height:190px;overflow:auto;font:11.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;
    background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--ink2)}
  .plog .ok{color:var(--ok)} .plog .warn{color:var(--danger)} .plog .dim{color:var(--muted)}
  .modal-ft{display:flex;justify-content:flex-end;margin-top:12px}
  .emap{height:300px;border-radius:12px;overflow:hidden;margin-bottom:14px;border:1px solid var(--line)}
  .emap .maplibregl-ctrl-attrib{font-size:9px}
  .wpmk{width:23px;height:23px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:800;
    display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45);cursor:grab}
  .maphint{font-size:11.5px;color:var(--muted);margin:-8px 0 12px}
  .wps{margin-top:12px} .wps .hh{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px}
  .wp{display:grid;grid-template-columns:1fr 90px 90px 30px;gap:6px;margin-bottom:6px}
  .wp input{padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:12.5px}
  .wp .x{background:var(--chip);border:1px solid var(--line);border-radius:8px;color:var(--danger);font-weight:800}
  .eactions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
  .eactions .sep{flex:1}
  .src{font-size:11px;color:var(--muted);margin-top:8px;font-family:ui-monospace,monospace;word-break:break-all}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
    padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);opacity:0;transition:.2s;pointer-events:none;z-index:20}
  .toast.show{opacity:1}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="loginView">
  <div class="card">
    <h1>🇮🇸 冰岛一日游 · 管理后台</h1>
    <p>用管理员账号登录以编辑路线与汇率。</p>
    <label class="field"><span>邮箱</span><input id="email" type="email" autocomplete="username" placeholder="admin@…"></label>
    <label class="field"><span>密码</span><input id="password" type="password" autocomplete="current-password" placeholder="••••••••"></label>
    <button class="btn" id="loginBtn" style="width:100%">登录</button>
    <div class="msg" id="loginMsg"></div>
  </div>
</div>

<!-- APP -->
<div id="appView" class="hidden">
  <div class="top">
    <h1>🇮🇸 管理后台</h1>
    <span class="who" id="who"></span>
    <button class="btn ghost sm" id="logoutBtn">退出</button>
  </div>
  <div class="wrap">
    <!-- rates -->
    <div class="rates">
      <div class="h">
        <b>汇率(基准:ISK 冰岛克朗)</b>
        <span class="upd" id="ratesUpd"></span>
        <span class="toolrow">
          <button class="btn sm" id="updRatesBtn">🔄 一键更新汇率</button>
          <button class="btn ghost sm" id="refreshPricesBtn" title="需先部署 Cloud Function(Blaze 计划)">💰 刷新所有价格</button>
        </span>
      </div>
      <div class="grid" id="ratesGrid"></div>
    </div>

    <!-- batch import + compare console -->
    <div class="rates" id="batchCard">
      <div class="h">
        <b>全量抓取 · 五网站对比操作台</b>
        <span class="upd" id="batchMsg"></span>
        <span class="toolrow">
          <button class="btn sm" id="batchAllBtn" title="按源配置全量抓取全部运营商并与数据库对比">🚀 全量拉取(5 家网站)</button>
          <button class="btn ghost sm" id="srcCfgBtn">⚙️ 源配置</button>
          <button class="btn ghost sm hidden" id="batchApplyBtn">✅ 应用选中</button>
        </span>
      </div>
      <div id="srcCfgPanel" class="srccfg hidden">
        <div class="srccfg-hd">源配置 · 存于 Firestore <code>config/sources</code>(有默认值,一般不用改)。<code>listing</code>=用列表页发现新路线;<code>urls</code>=显式网址(JS 渲染站)。</div>
        <textarea id="srcCfgText" class="srccfg-ta" spellcheck="false"></textarea>
        <div class="srccfg-actions"><button class="btn sm" id="srcCfgSave">💾 保存配置</button><button class="btn ghost sm" id="srcCfgReload">↺ 重新载入</button><span class="srccfg-msg" id="srcCfgMsg"></span></div>
      </div>
      <div id="batchResult" class="batchresult"></div>
    </div>

    <div class="grid2">
      <div class="card listwrap">
        <button class="btn sm" id="newBtn" style="width:100%;margin-bottom:8px">➕ 新建路线(AI 从网址导入)</button>
        <input class="search" id="search" placeholder="搜索路线 / 运营商…">
        <div class="count" id="count"></div>
        <div class="list" id="list"></div>
      </div>
      <div class="card editor">
        <div id="editorMap" class="emap hidden"></div>
        <div id="editorContent"><div class="empty">← 从左侧选择一条路线开始编辑</div></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- progress modal -->
<div class="modal hidden" id="pModal">
  <div class="modal-card">
    <div class="modal-hd"><span id="pTitle">正在全量抓取五个网站…</span><button class="modal-x" id="pClose" title="关闭">✕</button></div>
    <div class="pstage" id="pStage">准备中…</div>
    <div class="pbar"><div class="pfill" id="pFill"></div></div>
    <div class="pcount" id="pCount"></div>
    <div class="plog" id="pLog"></div>
    <div class="modal-ft"><button class="btn ghost sm" id="pCancel">取消</button></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, getDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-functions.js";

const cfg = {
  apiKey: "AIzaSyDnlko1B19JHfsaFPeCPBLCHu6bwDRlyAU",
  authDomain: "icelandtravel-5ad81.firebaseapp.com",
  projectId: "icelandtravel-5ad81",
  storageBucket: "icelandtravel-5ad81.firebasestorage.app",
  messagingSenderId: "231703663419",
  appId: "1:231703663419:web:4c9ba31e578fbc143a9d1e"
};
const app = initializeApp(cfg);
const auth = getAuth(app);
const db = getFirestore(app);
const functions = getFunctions(app, "australia-southeast1");

const OPS = { trollis:{zh:"Troll.is",c:"#2a78d6"}, magicicelandtravel:{zh:"Magic Iceland",c:"#eb6834"},
  bustravel:{zh:"BusTravel",c:"#1baf7a"}, adventures:{zh:"Arctic Adventures",c:"#6a4bd6"},
  nicetravel:{zh:"Nice Travel",c:"#c84f96"} };
const REGIONS = ["South Coast","Golden Circle","Snæfellsnes","West Iceland","Highland","East Iceland","North Iceland","Westfjords","Reykjanes","Activity"];
const CURS = ["ISK","AUD","USD","EUR","CNY","GBP"];
const $ = id => document.getElementById(id);
let TOURS = [], sel = null;

function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("show"); setTimeout(()=>el.classList.remove("show"),2200); }

// ---------- auth ----------
$("loginBtn").addEventListener("click", async () => {
  const btn=$("loginBtn"), msg=$("loginMsg"); msg.className="msg"; msg.textContent="";
  btn.disabled=true; btn.textContent="登录中…";
  try { await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value); }
  catch(e){ msg.className="msg err"; msg.textContent = "登录失败:"+(e.code||e.message); }
  btn.disabled=false; btn.textContent="登录";
});
$("password").addEventListener("keydown", e => { if(e.key==="Enter") $("loginBtn").click(); });
$("logoutBtn").addEventListener("click", () => signOut(auth));
$("newBtn").addEventListener("click", () => newTour());

onAuthStateChanged(auth, async (user) => {
  if (user) {
    $("loginView").classList.add("hidden"); $("appView").classList.remove("hidden");
    $("who").textContent = user.email;
    await loadAll();
  } else {
    $("appView").classList.add("hidden"); $("loginView").classList.remove("hidden");
    TOURS=[]; sel=null;
  }
});

// ---------- load ----------
async function loadAll(){
  const snap = await getDocs(collection(db,"tours"));
  TOURS = snap.docs.map(d => ({ _id:d.id, ...d.data() }));
  TOURS.sort((a,b)=> (a.operator||"").localeCompare(b.operator) || (a.short||"").localeCompare(b.short||""));
  renderList();
  try { const rs = await getDocs(collection(db,"config")); const r = rs.docs.find(d=>d.id==="rates"); renderRates(r?r.data():null); }
  catch(e){ renderRates(null); }
}

// ---------- rates ----------
function renderRates(data){
  const g=$("ratesGrid");
  if(!data || !data.rates){ g.innerHTML='<span class="rate-pill">尚无汇率,点「一键更新汇率」</span>'; $("ratesUpd").textContent=""; return; }
  $("ratesUpd").textContent = "更新于 " + (data.updated||"").slice(0,16).replace("T"," ");
  g.innerHTML = CURS.filter(c=>c!=="ISK" && data.rates[c]).map(c =>
    `<span class="rate-pill">1 ISK = <b>${(+data.rates[c]).toFixed(5)}</b> ${c}</span>`).join("")
    + `<span class="rate-pill" style="opacity:.7">10,000 ISK ≈ <b>${data.rates.AUD?Math.round(10000*data.rates.AUD):"?"}</b> AUD</span>`;
}
$("updRatesBtn").addEventListener("click", async () => {
  const b=$("updRatesBtn"); b.disabled=true; b.textContent="更新中…";
  try{
    const d = await (await fetch("https://open.er-api.com/v6/latest/ISK")).json();
    if(d.result!=="success") throw new Error("FX API 返回失败");
    const rates={}; CURS.forEach(c=>{ if(d.rates[c]!=null) rates[c]=d.rates[c]; });
    const payload={ base:"ISK", rates, updated:new Date().toISOString(), source:"open.er-api.com" };
    await setDoc(doc(db,"config","rates"), payload);
    renderRates(payload); toast("汇率已更新 ✓");
  }catch(e){ toast("更新失败:"+(e.code||e.message)); }
  b.disabled=false; b.textContent="🔄 一键更新汇率";
});
$("refreshPricesBtn").addEventListener("click", async () => {
  const b=$("refreshPricesBtn"); b.disabled=true; b.textContent="刷新中…";
  try{
    const res = await httpsCallable(functions,"refreshPrices")({});
    toast("价格已刷新:"+JSON.stringify(res.data)); await loadAll();
  }catch(e){
    toast("需先部署 Cloud Function(Blaze):"+(e.code||e.message));
  }
  b.disabled=false; b.textContent="💰 刷新所有价格";
});

// ---------- batch import + compare console ----------
// ---- source registry (Firestore config/sources): listing=用列表页发现新路线, urls=显式网址(JS 渲染站) ----
const DEFAULT_SOURCES = { operators: {
  trollis:{zh:"Troll.is",color:"#2a78d6",order:0,enabled:true,listing:"",urls:[]},
  magicicelandtravel:{zh:"Magic Iceland",color:"#eb6834",order:1,enabled:true,listing:"",urls:[]},
  bustravel:{zh:"BusTravel",color:"#1baf7a",order:2,enabled:true,listing:"https://bustravel.is/iceland-tours/",urls:[]},
  adventures:{zh:"Arctic Adventures",color:"#6a4bd6",order:3,enabled:true,listing:"https://cn.adventures.is/iceland/day-tours/",urls:[]},
  nicetravel:{zh:"Nice Travel",color:"#c84f96",order:4,enabled:true,listing:"https://nicetravel.is/iceland-day-tours-from-reykjavik/",urls:[]},
}};
let SOURCES=null;
async function loadSources(){
  if(SOURCES) return SOURCES;
  try{ const s=await getDoc(doc(db,"config","sources")); SOURCES = (s.exists()&&s.data().operators)? s.data() : DEFAULT_SOURCES; }
  catch(e){ SOURCES = DEFAULT_SOURCES; }
  return SOURCES;
}
// ---- progress modal ----
const pModal=$("pModal"); let pCancelled=false;
function pOpen(t){ pCancelled=false; $("pTitle").textContent=t||"正在全量抓取…"; $("pStage").textContent="准备中…"; $("pFill").style.width="0%"; $("pCount").textContent=""; $("pLog").innerHTML=""; pModal.classList.remove("hidden"); }
function pDone(){ pModal.classList.add("hidden"); }
function pStageEl(t){ $("pStage").textContent=t; }
function pProg(d,t){ $("pFill").style.width=(t?Math.round(d/t*100):0)+"%"; $("pCount").textContent=t?`${d} / ${t} 条`:""; }
function pLog(msg,cls){ const e=document.createElement("div"); if(cls)e.className=cls; e.textContent=msg; const L=$("pLog"); L.appendChild(e); L.scrollTop=L.scrollHeight; }
$("pCancel").addEventListener("click",()=>{ pCancelled=true; pStageEl("正在取消…(等待进行中的请求结束)"); });
$("pClose").addEventListener("click",()=>{ pCancelled=true; pDone(); });

const REYK_WP = {name:"Pickup in Reykjavik", lat:64.142029, lng:-21.926494};
const slugId = u => u.replace(/\/+$/,"").split("/").pop().toLowerCase().replace(/[^a-z0-9\-]/g,"").slice(0,60);
const inIceland = w => w && isFinite(+w.lat) && isFinite(+w.lng) && +w.lat>=63 && +w.lat<=67.5 && +w.lng>=-25 && +w.lng<=-12;
function toISK(price, cur, rates){
  if(price==null || !isFinite(+price)) return null;
  if(!cur || cur==="ISK") return Math.round(+price);
  const r = rates && rates[cur];                 // rates are ISK->cur; invert to get ISK
  return r ? Math.round(+price / r) : Math.round(+price);
}
// concurrency-limited parallel map (fans out the per-page function calls)
async function pool(items, n, fn){
  const out=new Array(items.length); let i=0;
  await Promise.all(Array.from({length:Math.min(n,items.length||1)}, async ()=>{
    while(i<items.length){ const k=i++; try{ out[k]=await fn(items[k],k); }catch(e){ out[k]={__err:(e&&(e.code||e.message))||"抓取失败"}; } }
  }));
  return out;
}
const CMP = ["price","short","name","name_zh","hours","rating","region"];
const CMPZH = {price:"价格",short:"短名",name:"名称",name_zh:"中文名",hours:"时长",rating:"评分",region:"区域"};
let BATCH=[];

// ---- one button: pull every source, compare against the live DB ----
$("batchAllBtn").addEventListener("click", async ()=>{
  const b=$("batchAllBtn"); b.disabled=true;
  $("batchResult").innerHTML=""; $("batchApplyBtn").classList.add("hidden"); BATCH=[];
  pOpen("正在全量抓取五个网站…");
  try{
    pStageEl("读取源配置…");
    const src = await loadSources();
    const ops = Object.entries(src.operators||{}).filter(([k,o])=>o&&o.enabled!==false).sort((a,b)=>(a[1].order||0)-(b[1].order||0));
    // 1) collect the URL list per operator (listing discovery ∪ explicit urls)
    const jobs=[]; const seen=new Set();
    for(const [key,o] of ops){
      if(pCancelled) break;
      let urls = Array.isArray(o.urls)? o.urls.slice() : [];
      if(o.listing){
        pStageEl(`发现列表页:${o.zh||key}`);
        try{ const d=(await httpsCallable(functions,"discoverListing")({listing:o.listing})).data; urls=urls.concat(d.urls||[]); pLog(`✓ ${o.zh||key}:列表页发现 ${d.count} 条`,"ok"); }
        catch(e){ pLog(`⚠ ${o.zh||key}:列表页发现失败(${e.code||e.message||e}),改用已存网址`,"warn"); }
      }
      let n=0;
      for(let u of urls){ u=(u||"").trim(); if(!/^https?:\/\//.test(u)) continue; u=u.replace(/\/+$/,"")+"/"; const dk=key+"|"+u; if(seen.has(dk)) continue; seen.add(dk); jobs.push({url:u,op:key}); n++; }
      pLog(`· ${o.zh||key}:待抓取 ${n} 条`,"dim");
    }
    if(!jobs.length){ pStageEl("没有可抓取的网址(检查源配置)"); b.disabled=false; return; }
    let rates=null; try{ const rs=await getDocs(collection(db,"config")); const rd=rs.docs.find(d=>d.id==="rates"); rates=rd?rd.data().rates:null; }catch(e){}
    // 2) fan out extraction across every detail page (each aiImport = one short function call)
    pStageEl(`并行抓取详情页(${jobs.length} 条)…`); pProg(0,jobs.length);
    let done=0;
    const raw = await pool(jobs, 6, async (job)=>{
      if(pCancelled) return {__cancel:true};
      let r; try{ r=(await httpsCallable(functions,"aiImport")({url:job.url})).data; }catch(e){ r={__err:(e&&(e.code||e.message))||"抓取失败"}; }
      done++; pProg(done,jobs.length);
      const okr = r && !r.__err && !r.__cancel;
      pLog((okr?"✓ ":"⚠ ")+`[${src.operators[job.op]?.zh||job.op}] ${decodeURIComponent(job.url.split("/").filter(Boolean).pop()||job.url)}`, okr?"ok":"warn");
      return r;
    });
    if(pCancelled){ pStageEl("已取消"); b.disabled=false; return; }
    // 3) build records + diff against the live DB
    pStageEl("与数据库对比…");
    BATCH = raw.map((r,i)=>{
      const job=jobs[i], op=job.op;
      if(!r || r.__err || r.__cancel) return { url:job.url, op, status:"error", err:(r&&r.__err)||"抓取失败" };
      const canon=(r.url||job.url).replace(/\/+$/,"")+"/";
      const wps=(r.waypoints||[]).filter(inIceland).map(w=>({name:String(w.name),lat:+w.lat,lng:+w.lng}));
      const rec={ id:`${op}_${slugId(canon)}`, operator:op, short:(r.short||r.name||"").slice(0,52), name:r.name||"", name_zh:r.name_zh||"",
        price:toISK(r.price,r.currency,rates), currency:"ISK", unit:"每人", hours:(r.hours==null?null:+r.hours), rating:+(r.rating||0)||0,
        region:r.region||"Activity", vip:false, url:canon, waypoints:[REYK_WP, ...wps] };
      const ex=TOURS.find(t=>t._id===rec.id);
      let status="new", changed=[];
      if(ex){ changed=CMP.filter(f=>String(ex[f]??"")!==String(rec[f]??"")); if((ex.waypoints||[]).length!==rec.waypoints.length) changed.push("waypoints"); status=changed.length?"changed":"same"; }
      return { url:canon, op, status, changed, existing:ex||null, record:rec };
    });
    renderBatch();
    pStageEl("完成 ✓  在下方勾选要应用的改动,点「应用选中」"); pProg(jobs.length,jobs.length);
    setTimeout(pDone, 1100);
  }catch(e){ pStageEl("失败:"+(e.code||e.message||e)); pLog(String(e.message||e),"warn"); }
  b.disabled=false;
});

function diffHtml(r){
  const ex=r.existing, rec=r.record;
  const parts = r.changed.map(f=>{
    if(f==="waypoints") return `<span class="fld">途径点</span> <s>${(ex.waypoints||[]).length}站</s> → <b>${rec.waypoints.length}站</b>`;
    return `<span class="fld">${CMPZH[f]||f}</span> <s>${ex[f]??"—"}</s> → <b>${rec[f]??"—"}</b>`;
  });
  return parts.join('<span class="sep">·</span>');
}
function renderBatch(){
  const g=$("batchResult");
  const order={new:0,changed:1,error:2,same:3};
  const rows=[...BATCH].sort((a,b)=>order[a.status]-order[b.status]);
  const badge={new:"🆕 新增",changed:"✏️ 已变更",same:"✓ 未变",error:"⚠️ 失败"};
  const cnt=s=>BATCH.filter(r=>r.status===s).length;
  let html="", lastG=null;
  const GH={new:"🆕 新增(数据库没有)",changed:"✏️ 已存在但内容变了",error:"⚠️ 抓取失败",same:"✓ 已存在且未变"};
  for(const r of rows){
    if(r.status!==lastG){ html+=`<div class="bgrouphd">${GH[r.status]}</div>`; lastG=r.status; }
    const i=BATCH.indexOf(r);
    if(r.status==="error"){ html+=`<div class="brow error"><span></span><span class="bstat">⚠️</span><span class="bname">${r.url}</span><span class="bmeta">${r.err}</span></div>`; continue; }
    const rec=r.record;
    const checked=(r.status==="new"||r.status==="changed")?"checked":"";
    const disabled=(r.status==="same")?"disabled":"";
    html+=`<label class="brow ${r.status}">
      <input type="checkbox" data-i="${i}" ${checked} ${disabled}>
      <span class="bstat">${badge[r.status]}</span>
      <span class="bname">${rec.short||rec.name||rec.id}</span>
      <span class="bmeta">${OPS[rec.operator]?.zh||rec.operator} · ${rec.region} · ${rec.price==null?"未标价":rec.price+" ISK"} · ${Math.max(rec.waypoints.length-1,0)}站${rec.hours?` · ${rec.hours}h`:""}</span>
      ${r.status==="changed"?`<span class="bdiff">${diffHtml(r)}</span>`:""}
      <span class="burl">${r.url}</span>
    </label>`;
  }
  g.innerHTML=html;
  const n=cnt("new")+cnt("changed");
  const ab=$("batchApplyBtn"); ab.classList.toggle("hidden", BATCH.length===0); ab.textContent=`✅ 应用选中(${n})`;
  $("batchMsg").textContent=`共 ${BATCH.length}:🆕${cnt("new")} 新增 · ✏️${cnt("changed")} 变更 · ✓${cnt("same")} 未变 · ⚠️${cnt("error")} 失败`;
}

// ---- live editor map (MapLibre) ----
let emap=null, emarkers=[], mapReady=false;
function ensureMap(){
  if(emap) return;
  emap=new maplibregl.Map({container:"editorMap",style:"https://basemaps.cartocdn.com/gl/positron-gl-style/style.json",center:[-19,64.9],zoom:5,attributionControl:{compact:true}});
  emap.addControl(new maplibregl.NavigationControl({showCompass:false}),"top-right");
  // click empty map -> add a waypoint at that point
  emap.on("click",e=>{
    if(!sel) return;
    addWpRow({name:"新途径点",lat:+e.lngLat.lat.toFixed(4),lng:+e.lngLat.lng.toFixed(4)});
    drawRoute(false);
  });
  // add the line source/layer once the style is ready (poll: robust if 'load' is slow)
  (function trySetup(){
    if(emap.isStyleLoaded()){
      if(!emap.getSource("er")){
        emap.addSource("er",{type:"geojson",data:{type:"Feature",geometry:{type:"LineString",coordinates:[]}}});
        emap.addLayer({id:"er-line",type:"line",source:"er",layout:{"line-cap":"round","line-join":"round"},paint:{"line-color":"#0e7c86","line-width":3,"line-opacity":.85}});
      }
      mapReady=true; drawLineOnly();
    } else setTimeout(trySetup,180);
  })();
}
function readWps(){
  return [...document.querySelectorAll("#wpList .wp")].map(row=>({
    name: row.querySelector('[data-wk="name"]').value,
    lat: parseFloat(row.querySelector('[data-wk="lat"]').value),
    lng: parseFloat(row.querySelector('[data-wk="lng"]').value),
  }));
}
function lineData(wps){ return {type:"Feature",geometry:{type:"LineString",coordinates:wps.filter(w=>isFinite(w.lat)&&isFinite(w.lng)).map(w=>[w.lng,w.lat])}}; }
function drawLineOnly(){ if(emap&&emap.getSource&&emap.getSource("er")) emap.getSource("er").setData(lineData(readWps())); }
function drawRoute(fit){
  if(!emap) return;
  const wps=readWps().filter(w=>isFinite(w.lat)&&isFinite(w.lng));
  drawLineOnly();                                  // line (only if style ready)
  emarkers.forEach(m=>m.remove()); emarkers=[];    // markers work without the style
  const rows=[...document.querySelectorAll("#wpList .wp")];
  rows.forEach((row,i)=>{
    const lat=parseFloat(row.querySelector('[data-wk="lat"]').value), lng=parseFloat(row.querySelector('[data-wk="lng"]').value);
    if(!isFinite(lat)||!isFinite(lng)) return;
    const el=document.createElement("div"); el.className="wpmk"; el.textContent=i+1;
    el.title=row.querySelector('[data-wk="name"]').value||("点 "+(i+1));
    const mk=new maplibregl.Marker({element:el,draggable:true}).setLngLat([lng,lat]).addTo(emap);
    mk.on("dragend",()=>{ const ll=mk.getLngLat();
      row.querySelector('[data-wk="lat"]').value=(+ll.lat.toFixed(4));
      row.querySelector('[data-wk="lng"]').value=(+ll.lng.toFixed(4));
      drawLineOnly();
    });
    emarkers.push(mk);
  });
  if(fit && wps.length){ const b=new maplibregl.LngLatBounds(); wps.forEach(w=>b.extend([w.lng,w.lat])); emap.fitBounds(b,{padding:45,maxZoom:10,duration:0}); }
}
function newRow(w){
  const row=document.createElement("div"); row.className="wp";
  row.innerHTML=`<input data-wk="name" value="${esc(w.name||"")}" placeholder="站点名">
    <input data-wk="lat" value="${w.lat??""}" placeholder="lat" class="tnum">
    <input data-wk="lng" value="${w.lng??""}" placeholder="lng" class="tnum">
    <button class="x" title="删除">×</button>`;
  row.querySelector(".x").addEventListener("click",()=>{ row.remove(); drawRoute(false); });
  row.querySelectorAll('[data-wk="lat"],[data-wk="lng"]').forEach(inp=> inp.addEventListener("input", drawRoute.bind(null,false)));
  row.querySelector('[data-wk="name"]').addEventListener("input",()=>drawRoute(false));
  return row;
}
function addWpRow(w){ $("wpList").appendChild(newRow(w)); }

async function aiImport(){
  const url=$("aiUrl").value.trim(); if(!url){ toast("请先粘贴网址"); return; }
  const b=$("aiBtn"); b.disabled=true; b.textContent="AI 拉取中…";
  try{
    const res=await httpsCallable(functions,"aiImport")({url});
    const d=res.data||{};
    ["short","name","name_zh","price","currency","hours","rating","region","operator","url"].forEach(k=>{
      if(d[k]!=null && d[k]!=="") sel[k]=d[k];
    });
    if(!sel.url) sel.url=url;
    if(Array.isArray(d.waypoints) && d.waypoints.length)
      sel.waypoints=d.waypoints.map(w=>({name:w.name,lat:+w.lat,lng:+w.lng})).filter(w=>w.name&&isFinite(w.lat)&&isFinite(w.lng));
    if(sel._isNew && sel.operator && sel.url){
      const slug=sel.url.replace(/\/+$/,"").split("/").pop().replace(/[^a-z0-9\-]/gi,"").toLowerCase().slice(0,60);
      if(slug) sel._id=sel.operator+"_"+slug;
    }
    renderEditor(); toast("AI 已填充,请核对 / 拖动地图标记校正后保存");
  }catch(e){ toast("AI 导入失败(需先部署 Function 并设置 OPENAI 密钥):"+(e.code||e.message)); }
  b.disabled=false; b.textContent="🤖 AI 导入";
}

function collect(){
  const t={ ...sel };
  $("editorContent").querySelectorAll("[data-k]").forEach(el=>{
    let k=el.dataset.k, v=el.value;
    if(["price","rating","hours"].includes(k)) v = v===""?null:Number(v);
    if(k==="vip") v = v==="true";
    t[k]=v;
  });
  t.waypoints = readWps().filter(w=> w.name || (isFinite(w.lat)&&isFinite(w.lng)))
    .map(w=>({name:w.name, lat:w.lat, lng:w.lng}));
  delete t._id; delete t._isNew;
  return t;
}
async function save(){
  const b=$("saveBtn"); b.disabled=true; b.textContent="保存中…";
  try{
    const id=sel._id, data=collect();
    await setDoc(doc(db,"tours",id), data);
    sel={_id:id, ...data};
    const idx=TOURS.findIndex(x=>x._id===id);
    if(idx>=0) TOURS[idx]=sel; else TOURS.push(sel);
    TOURS.sort((a,b)=> (a.operator||"").localeCompare(b.operator) || (a.short||"").localeCompare(b.short||""));
    renderList(); toast("已保存 ✓,刷新地图即生效");
  }catch(e){ toast("保存失败:"+(e.code||e.message)); }
  b.disabled=false; b.textContent="💾 保存";
}
async function del(){
  if(!confirm("确定删除「"+(sel.short||sel._id)+"」?此操作会从地图移除该路线。")) return;
  try{
    await deleteDoc(doc(db,"tours",sel._id));
    TOURS=TOURS.filter(x=>x._id!==sel._id); sel=null;
    $("editorMap").classList.add("hidden");
    $("editorContent").innerHTML='<div class="empty">已删除。← 选择另一条路线</div>'; renderList(); toast("已删除");
  }catch(e){ toast("删除失败:"+(e.code||e.message)); }
}
</script>
